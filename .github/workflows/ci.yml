name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test "test/*.test.mjs"
      - name: every documented `uses:` path must resolve
        run: python3 check-workflow-paths.py
