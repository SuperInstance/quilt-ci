name: bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: port

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone the benchmark suite
        uses: actions/checkout@v4
        with:
          repository: SuperInstance/gitpp-bench
          path: bench

      - name: Run the benchmark against this port
        id: run
        run: |
          cd bench
          PORT_DIR="../port" node bench.mjs "${{ inputs.port-path }}/${{ inputs.port-entry }}" 2>&1 | tee bench-output.txt
        continue-on-error: true

      - name: Post the result as a PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench
          message: |
            ```
            $(cat bench/bench-output.txt)
            ```

  call-workflow-bench:
    uses: ./.github/workflows/bench.yml
    secrets: inherit
