name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: port

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone the public conformance corpus
        uses: actions/checkout@v4
        with:
          repository: SuperInstance/gitpp-conformance
          path: conformance

      - name: Run the conformance runner against this port
        id: run
        run: |
          cd conformance
          PORT_DIR="../port" node runner.mjs "${{ inputs.port-path }}/${{ inputs.port-entry }}" 2>&1 | tee conformance-output.txt
        continue-on-error: false
        env:
          PORT: ${{ inputs.port-command }}

      - name: Post the result as a PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: conformance
          message: |
            ```
            $(cat conformance/conformance-output.txt)
            ```

  call-workflow-conformance:
    # Reusable workflow entry point — call from your port repo.
    uses: ./.github/workflows/conformance.yml
    secrets: inherit
